# Build, push to Artifact Registry, and update Cloud Run.
# WIF + repo secrets: terraform/README.md and scripts/print-github-actions-secrets.sh

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  # REPO must match terraform artifact_registry_repository_id (default digital-twin; underscores invalid in GCP).
  REGION: us-central1
  REPO: digital-twin
  SERVICE: digital-twin-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest -q tests

      # google-github-actions/auth@v2 requires a non-empty workload_identity_provider.
      # If any of these are unset, the action fails opaquely — fail here with a clear message.
      - name: Check GCP Action secrets
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set +x
          missing=""
          [ -z "${GCP_WIF_PROVIDER}" ] && missing="${missing} GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -z "${GCP_SA_EMAIL}" ] && missing="${missing} GCP_SERVICE_ACCOUNT_EMAIL"
          [ -z "${GCP_PROJECT_ID}" ] && missing="${missing} GCP_PROJECT_ID"
          if [ -n "${missing}" ]; then
            echo "::error::Missing or empty repository secrets:${missing}"
            echo ""
            echo "Add them under: Settings → Secrets and variables → Actions → New repository secret"
            echo "Names must match exactly (case-sensitive). See terraform/README.md."
            echo ""
            echo "If you added Values under Variables instead of Secrets, create Secrets with the same names — auth@v2 reads secrets.* only."
            echo "Fork PRs and some automation (e.g. Dependabot) do not receive secrets; push to main on this repo or use workflow_dispatch after secrets exist."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -eux
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/api:${GITHUB_SHA}"
          # Cloud Run is linux/amd64; explicit flag documents intent if runners change.
          docker build --platform linux/amd64 -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          # Optional: same value as TF_VAR_rag_corpus_resource_name in local .env (Settings → Variables).
          RAG_CORPUS_RESOURCE: ${{ vars.RAG_CORPUS_RESOURCE }}
          # Optional override; default matches terraform/variables.tf (comma in value → use ^;^ below).
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          # Optional: override Gemini model/location without Terraform apply.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_LOCATION: ${{ vars.GEMINI_LOCATION }}
        run: |
          set -eu
          # Default gcloud --update-env-vars splits on commas between KEY=value pairs, so
          # CORS_ALLOWED_ORIGINS=https://a,https://b cannot use the comma form. Custom delimiter ^;^
          # keeps one env value with commas inside.
          CORS="${CORS_ALLOWED_ORIGINS:-https://no-ego.net,https://www.no-ego.net}"
          EXTRA=""
          if [ -n "${RAG_CORPUS_RESOURCE}" ]; then
            EXTRA=";RAG_CORPUS_RESOURCE=${RAG_CORPUS_RESOURCE}"
          fi
          if [ -n "${GEMINI_MODEL:-}" ]; then
            EXTRA="${EXTRA};GEMINI_MODEL=${GEMINI_MODEL}"
          fi
          if [ -n "${GEMINI_LOCATION:-}" ]; then
            EXTRA="${EXTRA};GEMINI_LOCATION=${GEMINI_LOCATION}"
          fi
          gcloud run services update "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --update-env-vars "^;^GCP_PROJECT_ID=${PROJECT_ID};GCP_REGION=${REGION};CORS_ALLOWED_ORIGINS=${CORS}${EXTRA}" \
            --quiet

      # Idle session digest runs in a Cloud Run Job (Terraform digest_job.tf), not the API service.
      - name: Update session digest job image (optional)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SESSION_DIGEST_JOB_NAME: ${{ vars.SESSION_DIGEST_JOB_NAME }}
        run: |
          set -eu
          _trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          JOB="$(_trim "${SESSION_DIGEST_JOB_NAME:-}")"
          if [ -z "${JOB}" ]; then
            echo "SESSION_DIGEST_JOB_NAME unset; skip digest job image update"
            exit 0
          fi
          gcloud run jobs update "${JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --quiet

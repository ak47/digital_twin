# Re-import gs://…/rag-sources into the Vertex RagCorpus already wired in Terraform (rag_corpus_resource_name).
# Upload changed files to the corpus bucket first (e.g. gcloud storage cp … gs://BUCKET/rag-sources/).
#
# Corpus bucket + RagCorpus resource name are read from remote Terraform state (terraform output) so they
# stay aligned with Cloud Run — no duplicate GitHub Variables (CORPUS_BUCKET_NAME / RAG_CORPUS_RESOURCE).
#
# Secrets: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT_EMAIL, GCP_PROJECT_ID (same as Deploy API).
# Terraform: set gha_terraform_state_bucket in tfvars + TF_STATE_BUCKET repo Variable to the same state bucket,
# then terraform apply (grants the GitHub deploy SA storage.objectViewer for terraform init/output).
#
# The ingest script skips RagEngineConfig GET for existing corpora so the SA need not have
# aiplatform.ragEngineConfigs.get. rag.import_files requires aiplatform.ragFiles.import plus corpus
# bucket read; Terraform grants roles/aiplatform.user and storage.objectViewer on the corpus bucket.
# The job fails only if Vertex reports failed imports or the script hits permission/API errors.

name: Ingest RAG corpus

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ingest-rag-corpus-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check GCP secrets
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          missing=""
          [ -z "${GCP_WIF_PROVIDER}" ] && missing="${missing} GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -z "${GCP_SA_EMAIL}" ] && missing="${missing} GCP_SERVICE_ACCOUNT_EMAIL"
          [ -z "${GCP_PROJECT_ID}" ] && missing="${missing} GCP_PROJECT_ID"
          [ -z "${TF_STATE_BUCKET}" ] && missing="${missing} TF_STATE_BUCKET (repo variable)"
          if [ -n "${missing}" ]; then
            echo "::error::Missing secrets/variables:${missing}"
            exit 1
          fi

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify WIF credential targets GCP_SERVICE_ACCOUNT_EMAIL
        env:
          EXPECTED_SA: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          import google.auth
          import google.auth.transport.requests

          def sa_from_credentials_file(path: str) -> str:
              with open(path, encoding="utf-8") as f:
                  cfg = json.load(f)
              t = (cfg.get("type") or "").strip()
              if t == "service_account":
                  return (cfg.get("client_email") or "").strip()
              imp = cfg.get("service_account_impersonation_url") or ""
              if imp:
                  m = re.search(r"/serviceAccounts/([^:]+):generateAccessToken", imp)
                  if m:
                      return m.group(1).strip()
              sai = cfg.get("service_account_impersonation") or {}
              if isinstance(sai, dict):
                  return (sai.get("service_account_email") or "").strip()
              return ""

          def sa_from_tokeninfo(token: str) -> str:
              url = "https://oauth2.googleapis.com/tokeninfo?access_token=" + urllib.parse.quote(
                  token, safe=""
              )
              with urllib.request.urlopen(url) as resp:
                  info = json.load(resp)
              return (info.get("email") or "").strip()

          expected = (os.environ.get("EXPECTED_SA") or "").strip()
          gac = (os.environ.get("GOOGLE_APPLICATION_CREDENTIALS") or "").strip()
          email = ""
          if gac and os.path.isfile(gac):
              email = sa_from_credentials_file(gac)
          if not email:
              creds, _ = google.auth.default(
                  scopes=["https://www.googleapis.com/auth/cloud-platform"]
              )
              creds.refresh(google.auth.transport.requests.Request())
              email = sa_from_tokeninfo(creds.token)

          print(
              "Impersonated / credential service account (needs aiplatform.ragFiles.import):",
              email or "(could not resolve)",
          )
          if expected:
              print("GCP_SERVICE_ACCOUNT_EMAIL secret:", expected)
          if email and expected and email != expected:
              print(
                  "::error::Credential targets a different service account than GCP_SERVICE_ACCOUNT_EMAIL. "
                  "Fix repository secrets to match terraform output github_actions_deployer_email."
              )
              raise SystemExit(1)
          if expected and not email:
              print(
                  "::warning::Could not read impersonated SA from GOOGLE_APPLICATION_CREDENTIALS or tokeninfo; "
                  "skipping equality check."
              )
          PY

      - name: Terraform init & ingest
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -eu
          cd terraform
          terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}"
          BUCKET="$(terraform output -raw corpus_bucket_name)"
          CORPUS="$(terraform output -raw rag_corpus_resource_name)"
          cd ..
          if [ -z "${CORPUS}" ]; then
            echo "::error::Terraform output rag_corpus_resource_name is empty. Set rag_corpus_resource_name in terraform.tfvars and run terraform apply."
            exit 1
          fi
          echo "Corpus bucket (from Terraform state): ${BUCKET}"
          echo "RagCorpus (from Terraform state, same as Cloud Run when TF-managed): ${CORPUS}"
          mapfile -t OBJECT_URIS < <(gcloud storage ls "gs://${BUCKET}/rag-sources/**" 2>/dev/null || true)
          if [ "${#OBJECT_URIS[@]}" -eq 0 ]; then
            echo "::error::No objects found under gs://${BUCKET}/rag-sources/"
            exit 1
          fi
          echo "Found ${#OBJECT_URIS[@]} object(s) to import."
          failures=0
          pdf_internal_failures=0
          for uri in "${OBJECT_URIS[@]}"; do
            [ -z "${uri}" ] && continue
            case "${uri}" in
              */) continue ;; # skip directory placeholders
            esac
            echo ""
            echo "Importing: ${uri}"
            if ! uv run python scripts/ingest_rag_corpus.py \
              --project-id "${PROJECT_ID}" \
              --region "us-central1" \
              --bucket "${BUCKET}" \
              --corpus-resource-name "${CORPUS}" \
              --skip-upload \
              --files README.md \
              --import-path "${uri}" \
              --max-embedding-requests-per-min 120 \
              --corpus-busy-timeout-seconds 1200; then
              case "${uri}" in
                *.pdf|*.PDF)
                  echo "::warning::Skipping failed PDF import for now: ${uri} (Vertex internal error is a known Serverless instability)."
                  pdf_internal_failures=$((pdf_internal_failures + 1))
                  ;;
                *)
                  echo "::error::Failed importing ${uri}"
                  failures=$((failures + 1))
                  ;;
              esac
            fi
          done
          if [ "${pdf_internal_failures}" -gt 0 ]; then
            echo "::warning::RAG ingest skipped ${pdf_internal_failures} PDF file(s) due to Vertex internal errors."
          fi
          if [ "${failures}" -gt 0 ]; then
            echo "::error::RAG import finished with ${failures} failed object(s)."
            exit 1
          fi

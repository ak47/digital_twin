[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "digital-twin-api"
version = "0.1.0"
description = "Cloud Run API for career chat (Vertex RAG + Gemini)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.55.0",
    "google-cloud-error-reporting>=1.12.0",
    "google-cloud-logging>=3.16.0",
    "google-cloud-monitoring>=2.31.0",
    "google-cloud-storage>=3.11.0",
    "google-genai>=2.8.0",
    "google-cloud-aiplatform>=1.157.0",
    "google-cloud-bigquery>=3.42.1",
    "python-json-logger>=2.0.7",
    "sqlalchemy>=2.0.51",
    "alembic>=1.16.0",
    "psycopg[binary]>=3.3.4",
    "itsdangerous>=2.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_twin"]

[tool.hatch.build.targets.wheel.force-include]
"src/digital_twin/prompts/system.md" = "digital_twin/prompts/system.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["E501"]

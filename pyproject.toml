[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "digital-twin-api"
version = "0.1.0"
description = "Cloud Run API for career chat (Vertex RAG + Gemini)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.52.0",
    "google-cloud-error-reporting>=1.12.0",
    "google-cloud-logging>=3.12.0",
    "google-cloud-monitoring>=2.30.0",
    "google-cloud-storage>=2.18.0",
    "google-genai>=1.74.0",
    "google-cloud-aiplatform>=1.153.1",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_twin"]

[tool.hatch.build.targets.wheel.force-include]
"src/digital_twin/prompts/system.md" = "digital_twin/prompts/system.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["E501"]
